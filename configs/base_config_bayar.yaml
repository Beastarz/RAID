# Configuration: base_config_bayar.yaml
#
# Bayar+SRM-pipeline-only variant of base_config.yaml. Both currently point at
# the same ~10,000-sample manifest; kept as its own file rather than editing
# base_config.yaml so training.train_npr / training.train_semantic /
# training.train_fusion's data scale can diverge independently again -- this
# is training.train_bayar_srm's default --config.

seed: 42
image_size: 512
batch_size: 8
num_workers: 0
lr: 0.0001

# Stream-specific settings. Keep pretrained=false for offline smoke tests.
semantic:
  pretrained: false
  freeze_backbone: true
  unfreeze_last_n_blocks: 0
  output_dim: 1024

data:
  # Path to a manifest CSV with an `image_path,label` header (0=Real, 1=AI-Generated).
  # Falls back to an in-memory synthetic dataset for pipeline testing if this
  # path doesn't exist yet. Produced by (see training/data/import_hf.py and
  # training/data/shuffle_manifest.py):
  #   python -m training.data.import_hf --split train --output data/sid_binary_10000 --limit 10000
  #   python -m training.data.shuffle_manifest --input data/sid_binary_10000/manifest.csv --output data/sid_binary_10000/manifest.csv
  manifest_path: data/sid_binary_10000/manifest.csv
  num_synthetic_samples: 32
  val_split: 0.2

log_level: INFO
