# Configuration: model_config.yaml
# Model architecture settings.

semantic:
  # Set true for real training; it downloads torchvision's ViT-B/16 weights.
  pretrained: false
  freeze_backbone: true
  unfreeze_last_n_blocks: 0
  output_dim: 1024

forensic:
  # Default: NPRStream(backbone="resnet_shallow"). Bayar+SRM variant (what
  # the published checkpoints use) keeps the same output_dim.
  output_dim: 256

fusion:
  fused_dim: 512
